   a photo has to be scaled to the garment, not to the whole 200×380 canvas. */
const _bbox = {};
function shapeBBox(kind){
  if(_bbox[kind]) return _bbox[kind];
  const fallback = {x:40,y:70,w:120,h:110};
  const svg = document.getElementById('measure');
  if(!svg || !SHAPES[kind]) return fallback;
  try{
    svg.innerHTML = '<g id="mg">'+SHAPES[kind]+'</g>';
    const b = svg.querySelector('#mg').getBBox();
    svg.innerHTML = '';
    if(!b || !b.width) return fallback;
    return _bbox[kind] = { x:b.x, y:b.y, w:b.width, h:b.height };
  }catch(e){ return fallback; }
}

/* Where a photographed garment sits on the figure. Generous on purpose — the
   photo is fitted inside this box with its aspect ratio intact and is never
   masked, so a real garment keeps its own proportions and outline. */
const PHOTO_BOX = {
  hat:    [54,   0,  92,  62],
  top:    [32,  62, 136, 122],
  outer:  [28,  60, 144, 130],
  bottom: [46, 146, 108, 184],
  shoes:  [52, 286,  96,  52],
};

/* Paint a garment: photo-filled when one exists, flat colour otherwise. */
function garment(item){
  const photo = PHOTOS[item.id];
  if(photo){
    if(item.masked){
      /* Masked photo: a 400×760 PNG whose transparent regions are outside the
         clothing shape — lay it over the full doll canvas unchanged. */
      return '<image href="'+photo+'" x="0" y="0" width="200" height="380"/>';
    }
    /* Legacy: photo placed in its category's bounding box. */
    const k = PHOTO_BOX[GARMENTS[item.kind] ? GARMENTS[item.kind].cat : 'top'] || PHOTO_BOX.top;
    return '<image href="'+photo+'" x="'+k[0]+'" y="'+k[1]+'" width="'+k[2]+'" height="'+k[3]
         + '" preserveAspectRatio="xMidYMid meet"/>';
  }

  const shape = SHAPES[item.kind];
  if(!shape) return '';
  /* A light outline, not a dark one: garments sit on a dark surface, so black
     clothes would otherwise dissolve into the background. */
  return '<g fill="'+item.hex+'" stroke="rgba(255,255,255,.30)" stroke-width="1.4">'+shape+'</g>';
}

/* The doll. `outfit` maps category → item id. */
function doll(outfit, opts){
  const o = opts || {};
  const worn = SLOT_ORDER.map(cat=>{
    const it = itemById(outfit[cat]);
    return it ? garment(it) : '';
  }).join('');

  const hit = o.interactive ? SLOT_ORDER.map(cat=>{
    const zones = {
      hat:    [66,2,68,54],
      top:    [42,72,116,102],
      outer:  [42,72,116,102],
      bottom: [66,176,68,120],
      shoes:  [64,296,72,42],
    }[cat];
    if(cat==='outer') return '';                       // top zone covers both
    return '<rect class="dollhit" data-slot="'+cat+'" x="'+zones[0]+'" y="'+zones[1]
         + '" width="'+zones[2]+'" height="'+zones[3]+'" rx="10"><title>'+cat+'</title></rect>';
  }).join('') : '';

  /* A light mannequin tone — bare arms and legs have to read as skin, not as
     another dark garment. */
  return '<svg class="doll" viewBox="0 0 200 380" role="img" aria-label="Outfit preview">'
    + '<g fill="#a9a09a" stroke="rgba(0,0,0,.30)" stroke-width="1.2">'+BODY+'</g>'
    + worn + hit
    + '</svg>';
}

/* A single garment drawn small, for wardrobe tiles. */
function itemThumb(item){
  const b = shapeBBox(item.kind), p = 5;
  const vb = (b.x-p)+' '+(b.y-p)+' '+(b.w+2*p)+' '+(b.h+2*p);
  if(PHOTOS[item.id] && item.masked){
    /* Masked photo: full 200×380 canvas — crop viewBox to clothing region so
       only the shape area shows. Transparent outside = clean cut-out. */
    return '<svg class="thumb" viewBox="'+vb+'" role="img" aria-label="'+esc(item.name)+'">'
      +'<image href="'+PHOTOS[item.id]+'" x="0" y="0" width="200" height="380"/>'
      +'</svg>';
  }
  if(PHOTOS[item.id]){
    /* Legacy unmasked photo — show as-is. */
    return '<img class="thumb" src="'+PHOTOS[item.id]+'" alt="'+esc(item.name)+'">';
  }
  return '<svg class="thumb" viewBox="'+vb+'" role="img" aria-label="'+esc(item.name)+'">'
    + garment(item) + '</svg>';
}

/* =========================================================================
   WARDROBE — view
   ========================================================================= */
let closetPid = null, closetDow = null, closetCat = 'all', closetStored = false;
let closetMode = 'grid';                       // 'grid' | 'mix'
let mixDraft = {}, mixLocks = {};              // mix-and-match is a draft until saved

/* Which season are we in — used so shuffle doesn't put anyone in a parka in July. */
function nowSeason(){
  const m = new Date().getMonth();
  return m<=1||m===11 ? 'winter' : m<=4 ? 'spring' : m<=7 ? 'summer' : 'fall';
}
function seedDraft(){
  mixDraft = { ...planFor(closetPerson(), closetDay()) };
}
function setMode(m){
  closetMode = m;
  if(m==='mix') seedDraft();
  render();
}
function toggleLock(cat){
  mixLocks[cat] = !mixLocks[cat];
  render();
}

/* Items eligible for a slot: in rotation, and in season where possible. */
function wearable(cat, seasonAware){
  const all = itemsFor(closetPerson())
    .filter(w=>!w.stored && GARMENTS[w.kind].cat===cat);
  if(!seasonAware) return all;
  const s = nowSeason();
  const fit = all.filter(w=>w.season==='all' || w.season===s);
  return fit.length ? fit : all;          // don't strand a slot with nothing to pick
}

function shuffleOutfit(){
  let changed = 0;
  CATS.forEach(c=>{
    if(mixLocks[c.id]) return;
    const pool = wearable(c.id, true);
    if(!pool.length){ delete mixDraft[c.id]; return; }
    // hats and jackets are optional — let the shuffle leave them off sometimes
    const optional = (c.id==='hat' || c.id==='outer');
    const picks = optional ? [null, ...pool] : pool;
    const pick = picks[Math.floor(Math.random()*picks.length)];
    if(pick) mixDraft[c.id] = pick.id; else delete mixDraft[c.id];
    changed++;
  });
  if(!changed){ toast('Every band is locked — unlock one to shuffle.','bad'); return; }
  render();
}
function saveDraft(){
  const pid = closetPerson(), dow = closetDay();
  if(!Object.keys(mixDraft).length){ toast('Nothing picked to save.','bad'); return; }
  S.plans[pid] = S.plans[pid] || {};
  S.plans[pid][dow] = { ...mixDraft };
  commit();
  toast('Saved to '+DAYS_LONG[dow]+'.','good');
}
function clearDraft(){ mixDraft = {}; render(); }
function setDraft(cat, id){
  if(mixDraft[cat] === id) delete mixDraft[cat];
  else if(id) mixDraft[cat] = id;
  else delete mixDraft[cat];
  render();
}

function mixView(){
  const pid = closetPerson(), dow = closetDay();
  const season = nowSeason();

  const bands = CATS.map(c=>{
    const pool = wearable(c.id, false);
    const cur  = mixDraft[c.id];
    const locked = !!mixLocks[c.id];

    const cells = '<div class="bspace"></div>'
      + '<button class="bcell'+(!cur?' on':'')+'" data-cat="'+c.id+'" data-id=""'
        + ' aria-pressed="'+(!cur)+'"><span class="bnone">none</span>'
        + '<span class="bn">—</span></button>'
      + pool.map(w=>{
          const on = cur===w.id;
          const off = w.season!=='all' && w.season!==season;
          return '<button class="bcell'+(on?' on':'')+(off?' off':'')+'"'
            + ' data-cat="'+c.id+'" data-id="'+w.id+'" aria-pressed="'+on+'"'
            + ' title="'+esc(w.name)+(off?' — '+w.season:'')+'">'
            + itemThumb(w) + '<span class="bn">'+esc(w.name)+'</span></button>';
        }).join('')
      + '<div class="bspace tail"></div>';

    return '<div class="band'+(locked?' locked':'')+'">'
      + '<div class="bhead">'
        + '<button class="lock" onclick="toggleLock(\''+c.id+'\')" aria-pressed="'+locked+'"'
          + ' title="'+(locked?'Unlock':'Lock')+' '+c.name+' when shuffling">'
          + (locked?'🔒':'🔓')+'</button>'
        + '<span class="blabel">'+c.slot+'</span>'
      + '</div>'
      + '<div class="bstrip" data-strip="'+c.id+'">'
        + (pool.length ? cells : '<div class="bempty">No '+c.name.toLowerCase()+' in rotation</div>')
      + '</div>'
    + '</div>';
  }).join('');

  const planned = planFor(pid,dow);
  const dirty = JSON.stringify(planned) !== JSON.stringify(mixDraft);

  return '<div class="mix">'
    + '<div class="panel mixdoll">'
      + '<h3>'+DAYS_LONG[dow]+(dow===todayDow()?' — today':'')+'</h3>'
      + '<p class="cap">'+(dirty ? 'Unsaved combination' : 'Matches the saved plan')+'</p>'
      + '<div class="dollwrap" id="mixdoll">'+doll(mixDraft)+'</div>'
      + '<div class="mixacts">'
        + '<button class="btn primary wide" onclick="shuffleOutfit()">🎲 Shuffle</button>'
        + '<button class="btn wide'+(dirty?' go':'')+'"'+(dirty?' style="--accent:var(--good)"':'')
          + ' onclick="saveDraft()">Save to '+DAYS[dow]+'</button>'
        + '<button class="btn ghost wide" onclick="clearDraft()">Clear</button>'
      + '</div>'
      + '<p class="cap" style="margin:10px 0 0">Shuffle picks '+season
        + ' and all-year items, and skips anything locked or packed away.</p>'
    + '</div>'
    + '<div class="panel bands"><h3>Slide through the wardrobe</h3>'
      + '<p class="cap">Drag a row to change that layer. Lock a row to keep it while shuffling.</p>'
      + bands + '</div>'
  + '</div>';
}

/* Bands scroll; only the doll repaints, so scroll position survives. */
function wireBands(){
  document.querySelectorAll('.bcell').forEach(b=>{
    b.addEventListener('click', ()=>{
      setDraft(b.dataset.cat, b.dataset.id || null);
    });
  });
  document.querySelectorAll('.bstrip').forEach(strip=>{
    // start each row with its current pick centred
    const on = strip.querySelector('.bcell.on');
    if(on) on.scrollIntoView({block:'nearest', inline:'center'});

    let t = null;
    strip.addEventListener('scroll', ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{
        const r = strip.getBoundingClientRect(), cx = r.left + r.width/2;
        let best = null, bd = Infinity;
        strip.querySelectorAll('.bcell').forEach(c=>{
          const b = c.getBoundingClientRect();
          const d = Math.abs(b.left + b.width/2 - cx);
          if(d < bd){ bd = d; best = c; }
        });
        if(!best) return;
        const cat = best.dataset.cat, id = best.dataset.id || null;
        if((mixDraft[cat]||null) === id) return;
        if(id) mixDraft[cat] = id; else delete mixDraft[cat];
        strip.querySelectorAll('.bcell').forEach(c=>{
          const sel = c === best;
          c.classList.toggle('on', sel);
          c.setAttribute('aria-pressed', sel);
        });
        repaintMixDoll();
      }, 120);
    }, {passive:true});
  });
}
function repaintMixDoll(){
  const el = document.getElementById('mixdoll');
  if(el) el.innerHTML = doll(mixDraft);
  const pid = closetPerson(), dow = closetDay();
  const dirty = JSON.stringify(planFor(pid,dow)) !== JSON.stringify(mixDraft);
  const cap = document.querySelector('.mixdoll .cap');
  if(cap) cap.textContent = dirty ? 'Unsaved combination' : 'Matches the saved plan';
}

function closetPerson(){
  if(closetPid && S.people.some(p=>p.id===closetPid)) return closetPid;
  closetPid = S.people[0] ? S.people[0].id : null;
  return closetPid;
}
function closetDay(){
  if(closetDow===null || closetDow===undefined) closetDow = todayDow();
  return closetDow;
}
function pickPerson(id){ closetPid = id; if(closetMode==='mix') seedDraft(); render(); }
function pickDay(d){ closetDow = d; if(closetMode==='mix') seedDraft(); render(); }
function pickCat(c){ closetCat = c; render(); }
function toggleStored(){ closetStored = !closetStored; render(); }

function addItem({personId, kind, name, hex, season}){
  const it = { id:uid('w'), personId, kind, name, hex, season:season||'all', stored:false, photo:false };
  S.wardrobe.push(it);
  commit();
  return it;
}
function removeItem(id){
  const it = itemById(id);
  if(!it) return;
  if(!confirm('Remove “'+it.name+'” from the wardrobe?')) return;
  dropPhoto(id);
  S.wardrobe = S.wardrobe.filter(w=>w.id!==id);
  // and clear it out of any planned outfit
  Object.values(S.plans).forEach(days=>Object.values(days).forEach(o=>{
    Object.keys(o).forEach(c=>{ if(o[c]===id) delete o[c]; });
  }));
  commit();
}
function toggleStore(id){
  const it = itemById(id);
  if(!it) return;
  it.stored = !it.stored;
  if(it.stored){
    Object.values(S.plans).forEach(days=>Object.values(days).forEach(o=>{
      Object.keys(o).forEach(c=>{ if(o[c]===id) delete o[c]; });
    }));
  }
  commit();
}
function packSeason(pid, season){
  const hit = itemsFor(pid).filter(w=>w.season===season && !w.stored);
  if(!hit.length){ toast('Nothing in '+season+' left to pack.','bad'); return; }
  if(!confirm('Pack away '+hit.length+' '+season+' item'+(hit.length===1?'':'s')+'? '
    + 'They stay in the catalogue but drop out of outfit planning.')) return;
  hit.forEach(w=>{ w.stored = true; });
  Object.values(S.plans).forEach(days=>Object.values(days).forEach(o=>{
    Object.keys(o).forEach(c=>{ if(hit.some(w=>w.id===o[c])) delete o[c]; });
  }));
  commit();
  toast('Packed away '+hit.length+' '+season+' item'+(hit.length===1?'':'s')+'.','good');
}
function clearDay(pid,dow){
  if(S.plans[pid]) delete S.plans[pid][dow];
  commit();
}
function copyYesterday(pid,dow){
  const prev = (dow+6)%7;
  const src = planFor(pid,prev);
  if(!Object.keys(src).length){ toast('Nothing planned for '+DAYS_LONG[prev]+' to copy.','bad'); return; }
  S.plans[pid] = S.plans[pid] || {};
  S.plans[pid][dow] = { ...src };
  commit();
}

function closetView(){
  if(!S.people.length){
    return '<div class="section-label">Wardrobe</div>'
      + '<div class="panel"><div class="empty">Add someone under ⚙ Settings first — '
      + 'a wardrobe belongs to a person.</div></div>';
  }
  const pid = closetPerson(), dow = closetDay();
  const person = subjectOf(pid);
  const mine = itemsFor(pid);
  const outfit = planFor(pid,dow);

  const pchips = S.people.map(p=>
    '<button class="chip" onclick="pickPerson(\''+p.id+'\')" aria-pressed="'+(p.id===pid)+'"'
    + ' style="--cc:'+p.hex+'"><span class="av" style="--oc:'+p.hex+';--ai:'+ink(p.hex)+'">'
    + esc(p.initials)+'</span>'+esc(p.name)+'</button>').join('');

  // week strip — a mini doll per day
  const strip = DAYS.map((d,i)=>{
    const o = planFor(pid,i), n = Object.keys(o).length;
    return '<button class="daycard'+(i===dow?' sel':'')+(i===todayDow()?' today':'')+'"'
      + ' onclick="pickDay('+i+')" aria-pressed="'+(i===dow)+'">'
      + '<span class="dl">'+d+'</span>'
      + '<span class="dv">'+(n ? doll(o,{scope:'s'+i}) : '<span class="dnone">+</span>')+'</span>'
      + '</button>';
  }).join('');

  // the slot list beside the doll
  const slots = CATS.map(c=>{
    const it = itemById(outfit[c.id]);
    return '<div class="slot'+(it?'':' empty')+'">'
      + '<span class="sc">'+c.slot+'</span>'
      + (it
          ? '<span class="sv">'+itemThumb(it)+'<b>'+esc(it.name)+'</b></span>'
            + '<button class="btn sm ghost" onclick="setSlot(\''+pid+'\','+dow+',\''+c.id+'\',\''+it.id+'\')">Clear</button>'
          : '<span class="sv none">nothing picked</span>')
      + '</div>';
  }).join('');

  // wardrobe grid
  const visible = mine
    .filter(w=>closetStored ? w.stored : !w.stored)
    .filter(w=>closetCat==='all' ? true : GARMENTS[w.kind].cat===closetCat);
  const grid = visible.length
    ? visible.map(w=>{
        const cat = GARMENTS[w.kind].cat;
        const on  = outfit[cat]===w.id;
        return '<div class="wcard'+(on?' on':'')+(w.stored?' stored':'')+'">'
          + '<button class="wpick" onclick="setSlot(\''+pid+'\','+dow+',\''+cat+'\',\''+w.id+'\')"'
            + ' aria-pressed="'+on+'" title="'+(on?'Remove from':'Wear on')+' '+DAYS_LONG[dow]+'">'
            + itemThumb(w)
            + '<span class="wn">'+esc(w.name)+'</span>'
            + '<span class="wm">'+GARMENTS[w.kind].name
              + (w.season!=='all' ? ' · '+w.season : '')
              + (w.photo ? ' · 📷' : '')+'</span>'
          + '</button>'
          + '<div class="wacts">'
            + '<button class="btn sm ghost" onclick="openPhotoModal(\''+w.id+'\')">'+(w.photo?'📷 Replace':'📷 Photo')+'</button>'
            + (w.photo ? '<button class="btn sm ghost" onclick="dropPhoto(\''+w.id+'\')">Clear photo</button>' : '')
            + '<button class="btn sm ghost" onclick="toggleStore(\''+w.id+'\')">'+(w.stored?'Unpack':'Pack away')+'</button>'
            + '<button class="btn sm ghost del" onclick="removeItem(\''+w.id+'\')">✕</button>'
          + '</div>'
        + '</div>';
      }).join('')
    : '<div class="empty">'+(closetStored
        ? 'Nothing packed away.'
        : mine.length ? 'Nothing here in this category.' : 'This wardrobe is empty — add a few starters below.')+'</div>';

  const catTabs = '<button class="chip sm" onclick="pickCat(\'all\')" aria-pressed="'+(closetCat==='all')+'">All</button>'
    + CATS.map(c=>'<button class="chip sm" onclick="pickCat(\''+c.id+'\')" aria-pressed="'+(closetCat===c.id)+'">'
      + c.name+'</button>').join('');

  const starters = STARTERS.map((s,i)=>
    '<button class="chip sm" onclick="addStarter('+i+')">+ '+esc(s.name)+'</button>').join('');

  const packBtns = SEASONS.filter(s=>s.id!=='all').map(s=>{
    const n = mine.filter(w=>w.season===s.id && !w.stored).length;
    return '<button class="chip sm" onclick="packSeason(\''+pid+'\',\''+s.id+'\')"'
      + (n?'':' disabled')+'>Pack '+s.name.toLowerCase()+(n?' ('+n+')':'')+'</button>';
  }).join('');

  const storedN = mine.filter(w=>w.stored).length;

  const modes = '<div class="tabs modes">'
    + '<button onclick="setMode(\'grid\')" aria-selected="'+(closetMode==='grid')+'">Grid</button>'
    + '<button onclick="setMode(\'mix\')" aria-selected="'+(closetMode==='mix')+'">Mix &amp; match</button>'
    + '</div>';

  const head = '<div class="section-label">Wardrobe</div>'
    + '<div class="closethead">'
      + '<div class="chips">'+pchips+'</div>'+modes
    + '</div>'
    + '<div class="panel"><h3>'+esc(person.name)+'’s week</h3>'
      + '<p class="cap">'+(closetMode==='mix'
          ? 'Pick a day, slide the rows below, then save the combination to it.'
          : 'Pick a day, then tap items below to dress the doll. Tap a worn item again to take it off.')
      + '</p><div class="strip">'+strip+'</div></div>';

  if(closetMode==='mix') return head + mixView();

  return head
    + '<div class="closet">'
      + '<div class="panel dollpane">'
        + '<h3>'+DAYS_LONG[dow]+(dow===todayDow()?' — today':'')+'</h3>'
        + '<p class="cap">'+(Object.keys(outfit).length ? 'Planned outfit' : 'Nothing planned yet')+'</p>'
        + '<div class="dollwrap">'+doll(outfit,{scope:'main'})+'</div>'
        + '<div class="slots">'+slots+'</div>'
        + '<div class="chips" style="margin-top:12px">'
          + '<button class="chip sm" onclick="copyYesterday(\''+pid+'\','+dow+')">Copy '+DAYS[(dow+6)%7]+'</button>'
          + '<button class="chip sm" onclick="clearDay(\''+pid+'\','+dow+')">Clear day</button>'
        + '</div>'
      + '</div>'

      + '<div class="panel wardpane">'
        + '<h3>'+(closetStored ? 'Packed away' : 'In rotation')+'</h3>'
        + '<p class="cap">'+visible.length+' item'+(visible.length===1?'':'s')
          + (storedN && !closetStored ? ' · '+storedN+' packed away' : '')+'</p>'
        + '<div class="chips" style="margin-bottom:10px">'+catTabs
          + '<button class="chip sm" onclick="toggleStored()" aria-pressed="'+closetStored+'">'
          + (closetStored?'← In rotation':'Packed ('+storedN+')')+'</button></div>'
        + '<div class="wgrid">'+grid+'</div>'
        + '<div class="section-label" style="margin-top:18px">Add items</div>'
        + '<div class="chips">'+starters
          + '<button class="chip sm" onclick="openItem()">＋ Custom…</button></div>'
        + '<div class="section-label" style="margin-top:18px">Out of season</div>'
        + '<div class="chips">'+packBtns+'</div>'
      + '</div>'
    + '</div>';
}

function addStarter(i){
  const s = STARTERS[i];
  addItem({ personId:closetPerson(), kind:s.kind, name:s.name, hex:s.hex, season:s.season });
  toast('Added '+s.name);
}

let itemKind = 'tee', itemHex = '#3f5b7c', itemSeason = 'all';
function openItem(){
  itemKind='tee'; itemHex='#3f5b7c'; itemSeason='all';
  const kinds = Object.entries(GARMENTS).map(([k,g])=>
    '<button type="button" class="chip sm" data-k="'+k+'" aria-pressed="'+(k===itemKind)+'">'
    + g.name+'</button>').join('');
  const cols = CLOTH.map(([h,n])=>
    '<button type="button" class="sw2" data-h="'+h+'" title="'+n+'" aria-pressed="'+(h===itemHex)+'"'
    + ' style="background:'+h+'"></button>').join('');
  const seas = SEASONS.map(s=>
    '<button type="button" class="chip sm" data-s="'+s.id+'" aria-pressed="'+(s.id===itemSeason)+'">'
    + s.name+'</button>').join('');

  dlg.innerHTML = '<div class="dlg">'
    + '<h2>New wardrobe item</h2>'
    + '<p class="hint">Pick a shape and colour now; add a real photo from the tile afterwards.</p>'
    + '<div class="field"><label for="iname">Name</label>'
      + '<input type="text" id="iname" placeholder="e.g. Grey school polo" autocomplete="off"></div>'
    + '<div class="field"><label>Garment</label><div class="chips" id="ik">'+kinds+'</div></div>'
    + '<div class="field"><label>Colour</label><div class="chips" id="ic">'+cols+'</div></div>'
    + '<div class="field"><label>Season</label><div class="chips" id="is">'+seas+'</div></div>'
    + '<footer><button class="btn ghost" onclick="closeDlg()">Cancel</button>'
      + '<button class="btn primary" onclick="submitItem()">Add to wardrobe</button></footer>'
    + '</div>';

  const wire = (sel,attr,set)=> dlg.querySelectorAll(sel).forEach(b=> b.onclick = ()=>{
    set(b.dataset[attr]);
    dlg.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed', x===b));
  });
  wire('[data-k]','k',v=>itemKind=v);
  wire('[data-h]','h',v=>itemHex=v);
  wire('[data-s]','s',v=>itemSeason=v);

  dlg.showModal();
  const n = document.getElementById('iname');
  n.focus();
  n.onkeydown = e => { if(e.key==='Enter') submitItem(); };
}
function submitItem(){
  const name = document.getElementById('iname').value.trim() || GARMENTS[itemKind].name;
  addItem({ personId:closetPerson(), kind:itemKind, name, hex:itemHex, season:itemSeason });
  dlg.close();
  toast('Added '+name);
}

/* =========================================================================
   RENDER — setup + root
   ========================================================================= */
function setupView(){
  const rows = FAMILY.map((f,i)=>
    '<div class="prow"><span class="sw" style="--oc:'+f.hex+'"></span>'
    + '<input type="text" id="sp'+i+'" placeholder="Name — '+f.hint+'" autocomplete="off"></div>'
  ).join('');
  return '<div class="setup">'
    + '<h2>Who’s in the house? 🧺</h2>'
    + '<p class="lead">Seven colour slots — type a name beside each one you need. '
    + 'Blank rows are skipped, and you can add or rename people any time from ⚙ Settings. '
    + 'Names stay on this device.</p>'
    + '<div class="rows" style="margin-top:18px">'+rows+'</div>'
    + '<button class="btn primary wide" style="margin-top:18px" onclick="finishSetup()">Start tracking →</button>'
    + '</div>';
}
function finishSetup(){
  const picked = [];
  FAMILY.forEach((f,i)=>{
    const el = document.getElementById('sp'+i);
    const v = el ? el.value.trim() : '';
    if(v) picked.push({ name:v, hex:f.hex });
  });
  if(!picked.length){ toast('Add at least one name to get going.','bad'); return; }
  S.people = picked.map(p=>({ id:uid('p'), name:p.name, hex:p.hex, initials:initials(p.name), days:[] }));
  assignInitials();
  S.setup = true;
  commit();
  toast('Welcome aboard — add your first load 🧺','good');
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('fabbar').style.display = S.setup ? '' : 'none';
  document.getElementById('fabbar').style.display =
    (S.setup && view!=='closet') ? '' : 'none';
  ['.tabs','.deskadd','.top .btn.icon'].forEach(sel=>{
    const el = document.querySelector(sel);
    if(el) el.style.visibility = S.setup ? '' : 'hidden';
  });

  if(!S.setup){
    app.innerHTML = setupView();
    document.getElementById('tagline').textContent = 'let’s get you set up';
    document.title = 'Laundry HQ';
    return;
  }
  app.innerHTML = view==='board'  ? boardView()
                : view==='week'   ? weekView()
                : view==='closet' ? closetView()
                : statsView();
  if(view==='board') wireDnD();
  if(view==='closet') closetMode==='mix' ? wireBands() : wireDoll();

  const n = active().filter(l=>l.stage!=='done').length;
  document.getElementById('tagline').textContent =
    n ? n+' load'+(n===1?'':'s')+' in flight' : 'all caught up — nothing in flight';
  document.title = n ? '('+n+') Laundry HQ' : 'Laundry HQ';
}

function setView(v){
  view = v;
  ['board','week','closet','stats'].forEach(t=>
    document.getElementById('tab-'+t).setAttribute('aria-selected', v===t));
  render();
}

/* Tapping the doll jumps the wardrobe filter to that slot's category. */
function wireDoll(){
  document.querySelectorAll('.dollhit').forEach(el=>{
    el.addEventListener('click', ()=> pickCat(el.dataset.slot));
  });
}

/* =========================================================================
   DRAG & DROP (desktop nicety — buttons stay the primary path)
   ========================================================================= */
let dragId = null;
function wireDnD(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragId = el.dataset.load; el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragId=null; });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('over'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('over');
      const id = dragId || e.dataTransfer.getData('text/plain');
      const l  = S.loads.find(x=>x.id===id);
      if(l && l.stage !== col.dataset.stage) moveTo(id, col.dataset.stage);
    });
  });
}

/* =========================================================================
   DIALOGS
   ========================================================================= */
const dlg = document.getElementById('dlg');
function closeDlg(){ dlg.close(); }
dlg.addEventListener('click', e=>{ if(e.target === dlg) dlg.close(); });

let newSubject = null;

function openLoad(){
  const all = subjects();
  // default to whatever is up today and not yet done
  const due = all.filter(s=>subjectStatus(s).state!=='good'
                         && (daysOf(s).includes(todayDow()) || subjectStatus(s).state==='behind'));
  newSubject = (due[0] || all[0] || {}).id || null;

  const chips = all.map(s=>{
    const st = subjectStatus(s);
    const face = s.kind==='person'
      ? '<span class="av" style="--oc:'+s.hex+';--ai:'+ink(s.hex)+'">'+esc(s.initials)+'</span>'
      : '<span class="ce">'+(s.emoji||'🧺')+'</span>';
    const flag = st.state==='behind' ? '<span class="due">!</span>'
               : st.state==='today'  ? '<span class="due today">•</span>' : '';
    return '<button type="button" class="chip" data-subj="'+s.id+'" style="--cc:'+s.hex+'"'
      + ' aria-pressed="false" title="'+esc(st.text)+'">'+face+esc(s.name)+flag+'</button>';
  }).join('');

  dlg.innerHTML = '<div class="dlg">'
    + '<h2>New load</h2><p class="hint">Pick whose it is. It lands in <b>Sorted</b> — '
      + 'start the wash when a machine frees up.</p>'
    + '<div class="field"><label>Load</label><div class="chips" id="subjs">'+chips+'</div></div>'
    + '<div class="field"><label for="nl">Note <span style="text-transform:none;letter-spacing:0">(optional)</span></label>'
      + '<input type="text" id="nl" placeholder="e.g. delicates, do not tumble" autocomplete="off"></div>'
    + '<footer><button class="btn ghost" onclick="closeDlg()">Cancel</button>'
      + '<button class="btn primary" onclick="submitLoad()">Add to the pile</button></footer>'
    + '</div>';

  dlg.querySelectorAll('[data-subj]').forEach(b=> b.onclick = ()=>{
    newSubject = b.dataset.subj;
    dlg.querySelectorAll('[data-subj]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  });
  if(newSubject) dlg.querySelector('[data-subj="'+newSubject+'"]')?.setAttribute('aria-pressed','true');

  dlg.showModal();
  const nl = document.getElementById('nl');
  nl.onkeydown = e => { if(e.key==='Enter') submitLoad(); };
}
function submitLoad(){
  if(!newSubject){ toast('Pick whose load it is first.','bad'); return; }
  addLoad({ subjectId:newSubject, note:document.getElementById('nl').value });
  dlg.close();
}

function openSettings(){
  const prows = S.people.map((p,i)=>
    '<div class="prow" data-pid="'+p.id+'"><span class="sw" style="--oc:'+p.hex+'"></span>'
    + '<input type="text" value="'+esc(p.name)+'" data-pname="'+p.id+'" autocomplete="off">'
    + '<button class="del" title="Remove" onclick="delPerson(\''+p.id+'\')">✕</button></div>'
  ).join('');

  const mrows = S.machines.map(m=>
    '<div class="grid2" data-mid="'+m.id+'">'
    + '<input type="text" value="'+esc(m.name)+'" data-mname="'+m.id+'" autocomplete="off">'
    + '<input type="number" min="1" max="600" value="'+m.mins+'" data-mmins="'+m.id+'" title="Default minutes">'
    + '</div>'
  ).join('');

  dlg.innerHTML = '<div class="dlg">'
    + '<h2>Settings</h2>'
    + '<div class="field"><label>Household</label><div class="rows" id="prows">'+prows+'</div>'
      + '<div class="prow" style="margin-top:8px"><input type="text" id="newp" placeholder="Add someone…" autocomplete="off">'
      + '<button class="btn sm" onclick="addPerson()">Add</button></div></div>'
    + '<div class="field"><label>Machines &amp; default cycle (min)</label><div class="rows">'+mrows+'</div>'
      + '<div class="prow" style="margin-top:8px">'
      + '<button class="btn sm" onclick="addMachine(\'washer\')">＋ Washer</button>'
      + '<button class="btn sm" onclick="addMachine(\'dryer\')">＋ Dryer</button></div></div>'
    + '<div class="field"><label>Alerts</label>'
      + '<div class="switch"><div><div class="t">Chime when a cycle ends</div><div class="d">Short sound in this tab</div></div>'
        + '<button class="toggle" aria-pressed="'+!!S.settings.sound+'" onclick="toggleSound(this)"></button></div>'
      + '<div class="switch"><div><div class="t">Browser notifications</div><div class="d">Works even when this tab is in the background</div></div>'
        + '<button class="toggle" aria-pressed="'+!!S.settings.notify+'" onclick="toggleNotify(this)"></button></div>'
    + '</div>'
    + '<div class="field"><label>Data</label>'
      + '<div class="prow"><button class="btn sm" onclick="exportData()">Export JSON</button>'
      + '<button class="btn sm" onclick="wipe()" style="color:#ffb3b3">Reset everything</button></div>'
      + '<p class="hint" style="margin-top:8px">Everything lives in this browser only — nothing is uploaded. '
      + 'Each device keeps its own board.</p>'
      + '<p class="hint" style="margin-top:6px;opacity:.75">Build '+BUILD+' — if a phone '
      + 'shows an older build, it is running a stale copy of index.html.</p></div>'
    + '<footer><button class="btn primary" onclick="saveSettings()">Done</button></footer>'
    + '</div>';
  dlg.showModal();
}
function saveSettings(){
  dlg.querySelectorAll('[data-pname]').forEach(inp=>{
    const p = S.people.find(x=>x.id===inp.dataset.pname);
    const v = inp.value.trim();
    if(p && v) p.name = v;
  });
  assignInitials();
  dlg.querySelectorAll('[data-mname]').forEach(inp=>{
    const m = machineOf(inp.dataset.mname);
    if(m && inp.value.trim()) m.name = inp.value.trim();
  });
  dlg.querySelectorAll('[data-mmins]').forEach(inp=>{
    const m = machineOf(inp.dataset.mmins);
    const v = parseInt(inp.value,10);
    if(m && v>0 && v<=600) m.mins = v;
  });
  dlg.close(); commit();
}
function addPerson(){
  const inp = document.getElementById('newp');
  const v = inp.value.trim();
  if(!v) return;
  S.people.push({ id:uid('p'), name:v, hex:HEX[S.people.length%8], initials:initials(v), days:[] });
  assignInitials();
  save(); openSettings(); render();
}
function delPerson(id){
  const p = subjectOf(id);
  const n = S.loads.filter(l=>l.subjectId===id).length;
  if(!confirm('Remove '+p.name+'?' + (n ? ' Their '+n+' load'+(n===1?'':'s')+' become Household.' : ''))) return;
  S.loads.forEach(l=>{ if(l.subjectId===id) l.subjectId='other'; });
  S.people = S.people.filter(x=>x.id!==id);
  assignInitials();
  save(); openSettings(); render();
}
function addMachine(kind){
  const n = S.machines.filter(m=>m.kind===kind).length + 1;
  S.machines.push({
    id: uid('m'),
    name: (kind==='washer'?'Washer':'Dryer') + ' ' + n,
    kind, mins: kind==='washer' ? 45 : 60,
  });
  save(); openSettings(); render();
}
function toggleSound(btn){
  S.settings.sound = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', S.settings.sound);
  if(S.settings.sound) chime();
  save();
}
async function toggleNotify(btn){
  const want = btn.getAttribute('aria-pressed') !== 'true';
  if(want){
    if(!('Notification' in window)){ toast('This browser has no notification support.','bad'); return; }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifications were blocked in your browser settings.','bad'); return; }
  }
  S.settings.notify = want;
  btn.setAttribute('aria-pressed', want);
  save();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'laundry-hq-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function wipe(){
  if(!confirm('Erase every load, person and setting on this device?')) return;
  localStorage.removeItem(KEY);
  S = blank(); dlg.close(); render();
}

/* =========================================================================
   BOOT
   ========================================================================= */
(function bubbles(){
  const box = document.getElementById('bubbles');
  for(let i=0;i<16;i++){
    const b = document.createElement('i');
    const sz = 8 + Math.random()*34;
    b.style.width = b.style.height = sz+'px';
    b.style.left = (Math.random()*100)+'vw';
    b.style.animationDuration = (17+Math.random()*22)+'s';
    b.style.animationDelay = (-Math.random()*34)+'s';
    b.style.setProperty('--dx', ((Math.random()-.5)*140)+'px');
    box.appendChild(b);
  }
})();

addEventListener('keydown', e=>{
  if(dlg.open) return;
  if(e.key==='n' && !e.metaKey && !e.ctrlKey && S.setup){ e.preventDefault(); openLoad(); }
});

render();

/* Photos live in IndexedDB; pull them into memory then repaint so render()
   can stay synchronous. Failure here is non-fatal — shapes fall back to
   flat colour. */
photoAll()
  .then(all=>{ PHOTOS = all || {}; if(Object.keys(PHOTOS).length) render(); })
  .catch(()=>{ /* private mode or blocked storage — colours still work */ });
</script>
